[server]
host = 127.0.0.1
port = 8080

[google]
api_key = paste-your-google-api-key-here

[logging]
; Rotate after 1 MiB; keep five backup files plus the current application.log.
max_bytes = 1048576
backup_count = 5

[usage]
; Counts Google calls, including failed attempts and startup warming.
; Separate limits reset at midnight UTC and survive restarts via usage.ini.
daily_routes_limit = 150
daily_geocoding_limit = 300
