; Add your locations here. An empty file is also valid.
; Save this file to reload labels without restarting (allow 0.5 seconds).
; Invalid edits keep the previous labels and log a warning.
; New addresses/plus codes resolve when first used; settings and keys need a restart.
; A label contains exactly one: address, pluscode, OR latitude and longitude.
; Addresses and plus codes share the place-ID cache and warm at startup.
; Uncomment and replace these examples to enable your own labels.
; [home]
; address = 100 Example Street, Example City
;
; [work]
; latitude = 29.7604
; longitude = -95.3698
;
; Plus codes identify a location without a street address.
; Use a full/global code, or a short/compound code WITH city/region context.
; Keep the literal + character. Do not URL-encode it as %2B in this file.
; Never combine pluscode with address or latitude/longitude in one section.
; [meeting]
; pluscode = 849VCWC8+R9
;
; [meetingWithLocality]
; pluscode = CWC8+R9 Mountain View, CA, USA
